<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f172a"><title>ورود مدیریت | OMH</title><link rel="stylesheet" href="style.css"></head><body class="login-page"><main class="login-shell"><section class="login-card"><div class="login-brand"><img src="../images/omh-logo.svg" alt="OMH"><div><b>OMH</b><span>Social Services</span></div></div><div class="login-heading"><span class="badge">پنل مدیریت</span><h1>خوش آمدید 👋</h1><p>برای مدیریت خدمات و محتوای سایت وارد شوید.</p></div><form id="loginForm"><label>نام کاربری<input id="username" autocomplete="username" required placeholder="نام کاربری"></label><label>رمز عبور<div class="password-wrap"><input id="password" type="password" autocomplete="current-password" required placeholder="رمز عبور"><button id="togglePassword" type="button" aria-label="نمایش رمز">نمایش</button></div></label><button class="primary-btn" type="submit"><span>ورود به داشبورد</span><i>→</i></button><p id="loginError" class="error" aria-live="polite"></p></form><a class="back-link" href="/">← بازگشت به سایت</a></section></main><script>const f=document.getElementById('loginForm'),err=document.getElementById('loginError'),pw=document.getElementById('password');document.getElementById('togglePassword').onclick=()=>{pw.type=pw.type==='password'?'text':'password'};f.onsubmit=async e=>{e.preventDefault();err.textContent='';const btn=f.querySelector('button[type=submit]');btn.disabled=true;try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({username:document.getElementById('username').value.trim(),password:pw.value})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'ورود ناموفق بود.');location.href='/admin/dashboard';}catch(x){err.textContent=x.message;}finally{btn.disabled=false;}};</script></body></html>
