<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF ها | OMH Admin</title><link rel="icon" href="../images/omh-logo-circle.png"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><link rel="stylesheet" href="style.css"></head><body class="admin-page"><header class="admin-header"><div class="container header-inner"><a class="admin-brand" href="/admin/dashboard"><img src="../images/omh-logo-circle.png"><span><b>OMH</b><small>مدیریت PDF</small></span></a><div class="header-actions"><a class="outline-btn" href="/admin/dashboard">بازگشت به داشبورد</a></div></div></header><main class="container admin-main"><div class="page-heading"><div><span class="eyebrow">PDF Library</span><h1>نشرات PDF</h1><p>PDF را مستقیم آپلود کنید؛ سایت صفحه اول آن را به‌عنوان جلد پیش‌نمایش می‌سازد.</p></div></div><section class="admin-section"><form id="pdfForm" class="settings-grid"><label>عنوان PDF<input id="pdfTitle" required maxlength="160"></label><label>زبان<select id="pdfLang"><option value="fa">دری</option><option value="ps">پښتو</option><option value="en">English</option></select></label><label class="wide">توضیح<textarea id="pdfDesc" maxlength="1000"></textarea></label><label class="wide">فایل PDF<input id="pdfFile" type="file" accept="application/pdf" required></label><div class="wide"><button class="primary-btn" type="submit">آپلود و انتشار</button><span id="pdfMsg"></span></div></form></section><section class="admin-section" style="margin-top:20px"><div class="section-head"><div><h2>فایل‌های منتشرشده</h2></div><button class="outline-btn" id="reload">بروزرسانی</button></div><div id="docsList"></div></section></main><script>
const $=s=>document.querySelector(s);async function api(url,opt={}){const r=await fetch(url,{credentials:'include',...opt});const d=await r.json().catch(()=>({}));if(!r.ok){if(r.status===401)location.href='/admin';throw Error(d.error||'خطا')}return d}async function load(){const list=await api('/api/admin/documents');$('#docsList').innerHTML=list.map(x=>`<div style="display:flex;gap:15px;align-items:center;padding:15px;border-bottom:1px solid var(--line)"><div style="width:90px;height:110px;background:#07111f;border-radius:12px;display:grid;place-items:center"><i class="fa-solid fa-file-pdf" style="font-size:32px;color:#ff6682"></i></div><div style="flex:1"><b>${esc(x.title)}</b><p style="color:var(--muted);font-size:12px">${esc(x.description||'')}</p><small>${new Date(x.created_at).toLocaleDateString('fa-AF')}</small></div><button class="danger-outline" data-id="${x.id}">حذف</button></div>`).join('')||'<p style="color:var(--muted)">هنوز PDF منتشر نشده است.';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{if(confirm('حذف شود؟')){await api('/api/documents/'+b.dataset.id,{method:'DELETE'});load()}})}function esc(v){return String(v||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}$('#pdfForm').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;$('#pdfMsg').textContent='در حال آپلود...';try{const f=$('#pdfFile').files[0],fd=new FormData();fd.append('file',f);const up=await api('/api/admin/upload-pdf',{method:'POST',body:fd});await api('/api/documents',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:$('#pdfTitle').value.trim(),description:$('#pdfDesc').value.trim(),language:$('#pdfLang').value,file_url:up.url,is_active:true})});e.target.reset();$('#pdfMsg').textContent='PDF با موفقیت منتشر شد.';load()}catch(x){$('#pdfMsg').textContent=x.message}finally{b.disabled=false}};$('#reload').onclick=load;load();
</script></body></html>
